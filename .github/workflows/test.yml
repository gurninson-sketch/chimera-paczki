name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtime
        run: sudo apt-get update && sudo apt-get install -y texlive-luatex
      - name: Verify release assets and offline simulations on both Chimera versions
        run: python3 tools/test.py
      - name: Keep simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/
